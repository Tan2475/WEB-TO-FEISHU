<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>🚀 Scrape to Feishu Options</title>
  <link rel="stylesheet" href="../dist/tailwind.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }

    /* 导入导出模态：手写样式，不依赖 Tailwind 产物，避免改完页面还要重新构建 */
    .cfg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .cfg-overlay[hidden] { display: none; }
    .cfg-modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      max-height: 90vh;
      overflow-y: auto;
    }
    .cfg-title {
      font-size: 18px;
      font-weight: 700;
      color: #111827;
      margin: 0 0 12px;
    }
    .cfg-meta {
      font-size: 13px;
      line-height: 1.7;
      color: #4b5563;
      margin: 0 0 12px;
      word-break: break-all;
    }
    .cfg-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .15s, background-color .15s;
    }
    .cfg-check:hover { border-color: #d1d5db; }
    .cfg-check:has(input:checked) { border-color: #f59e0b; background: #fffbeb; }
    .cfg-check input { margin-top: 3px; flex-shrink: 0; }
    .cfg-check strong { display: block; font-size: 14px; color: #111827; font-weight: 600; }
    .cfg-check-desc { display: block; font-size: 12px; line-height: 1.6; color: #6b7280; margin-top: 2px; }
    .cfg-check.is-disabled { opacity: .55; cursor: not-allowed; }
    .cfg-file {
      font-size: 12px;
      color: #6b7280;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin: 10px 0 0;
      word-break: break-all;
    }
    .cfg-warn {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.7;
      color: #92400e;
      margin: 0 0 12px;
    }
    .cfg-warn[hidden] { display: none; }
    .cfg-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
    }
    .cfg-btn {
      font-size: 14px;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color .15s, border-color .15s;
      font-family: inherit;
    }
    .cfg-btn-ghost { background: #fff; border: 1px solid #d1d5db; color: #374151; }
    .cfg-btn-ghost:hover { background: #f9fafb; }
    .cfg-btn-primary { background: #111827; border: 1px solid #111827; color: #fff; }
    .cfg-btn-primary:hover { background: #000; }
    .cfg-btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .cfg-btn-danger { background: #dc2626; border: 1px solid #dc2626; color: #fff; }
    .cfg-btn-danger:hover { background: #b91c1c; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen p-8 text-gray-800">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="flex items-center space-x-4">
      <div class="w-12 h-12 bg-blue-600 text-white rounded-xl flex items-center justify-center text-2xl shadow-lg">🚀</div>
      <div class="min-w-0">
        <h1 class="text-3xl font-bold text-gray-900">推送到飞书 - 抓取配置</h1>
        <p class="text-gray-500 mt-1">配置飞书 API 与各个网站的字段抓取规则</p>
      </div>
      <div class="ml-auto flex items-center space-x-2 shrink-0">
        <button id="exportConfigBtn" type="button" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-lg text-sm font-medium transition shadow-xs" title="把当前配置导出为 JSON 文件">⬇ 导出配置</button>
        <button id="importConfigBtn" type="button" class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 px-4 py-2 rounded-lg text-sm font-medium transition shadow-xs" title="从 JSON 文件恢复配置">⬆ 导入配置</button>
      </div>
    </header>

    <!-- General Settings -->
    <section class="bg-white rounded-2xl shadow-xs border border-gray-100 p-6">
      <h2 class="text-xl font-bold flex items-center space-x-2 text-gray-800 mb-4">
        <svg class="w-5 h-5 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"></path></svg>
        <span>1. 飞书认证配置</span>
      </h2>
      <p class="text-sm text-gray-500 mb-6">填入您的飞书自建应用的 App ID 与 App Secret。需确保应用拥有「多维表格」相关权限。</p>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">App ID</label>
          <input type="text" id="feishuAppId" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-hidden transition" placeholder="cli_a4b*************">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">App Secret</label>
          <input type="password" id="feishuAppSecret" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-hidden transition" placeholder="************************">
        </div>
      </div>
      <div class="mt-4 flex justify-end">
        <button id="saveGlobalBtn" class="bg-gray-900 hover:bg-black text-white px-6 py-2 rounded-lg font-medium transition shadow-xs">保存全局配置</button>
      </div>
    </section>

    <!-- Rules Settings -->
    <section class="bg-white rounded-2xl shadow-xs border border-gray-100 p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold flex items-center space-x-2 text-gray-800">
          <svg class="w-5 h-5 text-purple-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
          <span>2. 网页抓取规则设置</span>
        </h2>
        <button id="addRuleBtn" class="bg-purple-100 text-purple-700 hover:bg-purple-200 px-4 py-2 rounded-lg text-sm font-medium transition flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          新增站点规则
        </button>
      </div>

      <div id="rulesContainer" class="space-y-6">
        <!-- Rules will be injected here via JS -->
      </div>
    </section>
  </div>

  <!-- 导出配置模态 -->
  <div id="exportModal" class="cfg-overlay" hidden>
    <div class="cfg-modal" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
      <h3 id="exportModalTitle" class="cfg-title">导出配置</h3>
      <p id="exportSummary" class="cfg-meta">正在统计…</p>

      <label id="exportCredentialRow" class="cfg-check">
        <input type="checkbox" id="includeCredentials">
        <span>
          <strong>包含飞书凭证</strong>
          <span id="exportCredentialDesc" class="cfg-check-desc">勾选后文件内会写入 App ID / App Secret 明文，等同于密码，请勿外发或提交到代码仓库。</span>
        </span>
      </label>

      <p id="exportFilenameHint" class="cfg-file"></p>

      <div class="cfg-actions">
        <button type="button" class="cfg-btn cfg-btn-ghost" data-close="exportModal">取消</button>
        <button type="button" id="confirmExportBtn" class="cfg-btn cfg-btn-primary">下载配置文件</button>
      </div>
    </div>
  </div>

  <!-- 导入配置模态 -->
  <div id="importModal" class="cfg-overlay" hidden>
    <div class="cfg-modal" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
      <h3 id="importModalTitle" class="cfg-title">导入配置</h3>
      <p id="importMeta" class="cfg-meta"></p>
      <div id="importWarnings" class="cfg-warn" hidden></div>
      <p class="cfg-meta">「覆盖」会清空当前全部规则；「追加」保留现有规则并在其后添加，重名会自动加后缀。</p>

      <div class="cfg-actions">
        <button type="button" class="cfg-btn cfg-btn-ghost" data-close="importModal">取消</button>
        <button type="button" id="confirmAppendBtn" class="cfg-btn cfg-btn-ghost">追加导入</button>
        <button type="button" id="confirmReplaceBtn" class="cfg-btn cfg-btn-danger">覆盖导入</button>
      </div>
    </div>
  </div>

  <input type="file" id="importFileInput" accept="application/json,.json" hidden>

  <!-- Toast Notification -->
  <div id="toast" role="status" aria-live="polite" class="fixed bottom-6 right-6 translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white px-6 py-3 rounded-xl shadow-2xl flex items-center space-x-3 pointer-events-none z-[70]">
    <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
    <span id="toastMessage" class="font-medium">配置已保存！</span>
  </div>

  <!-- Templates -->
  <template id="ruleTemplate">
    <div class="rule-block border border-gray-200 rounded-xl overflow-hidden transition-all hover:shadow-md relative bg-white">
      <!-- Header -->
      <div class="rule-header flex items-center justify-between py-3 px-5 bg-gray-50 border-b border-gray-200 cursor-pointer select-none hover:bg-gray-100 transition-colors">
        <div class="font-semibold text-gray-800 flex items-center space-x-2 min-w-0">
          <svg class="w-4 h-4 text-gray-400 toggle-icon transition-transform rotate-180 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          <span class="rule-header-title text-sm tracking-wide truncate">新规则</span>
        </div>
        <div class="flex items-center space-x-1 shrink-0">
          <button class="copy-rule-btn text-gray-400 hover:text-purple-600 hover:bg-white rounded-lg transition cursor-pointer p-1" title="复制规则">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
          </button>
          <button class="delete-rule-btn text-gray-400 hover:text-red-500 hover:bg-white rounded-lg transition cursor-pointer p-1" title="删除规则">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
          </button>
        </div>
      </div>

      <div class="rule-content bg-white">
        <div class="p-5 space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">规则名称 <span class="text-xs text-gray-400 font-normal ml-1">例：达人主页基础数据</span></label>
            <input type="text" class="rule-name w-full px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-hidden transition" placeholder="为这段规则起个名字">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">匹配 URL 关键字 <span class="text-xs text-gray-400 font-normal ml-1">例：xiaohongshu.com</span></label>
            <input type="text" class="rule-url w-full px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-hidden transition" placeholder="例如：xingtu.cn">
          </div>
        </div>
        <div class="pt-4 border-t border-gray-100">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">匹配字段 <span class="text-xs text-gray-400 font-normal ml-1">选填，匹配到更新，未匹配则新增</span></label>
          <input type="text" class="rule-match-field w-full px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-hidden transition" placeholder="填写下方已配置的飞书列名，例如：网页链接">
        </div>
        <div class="pt-4 border-t border-gray-100">
          <label class="block text-sm font-medium text-gray-700 mb-1.5">目标页签 <span class="text-xs text-gray-400 font-normal ml-1">选填，抓取前切换</span></label>
          <div class="flex items-center space-x-2">
            <input type="text" class="rule-tab-selector flex-1 min-w-0 px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-hidden transition font-mono" placeholder="页签的 CSS 选择器，例如：#business-tab">
            <button type="button" class="pick-tab-btn shrink-0 bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 px-3 py-2 rounded-lg transition text-sm font-medium whitespace-nowrap" title="在网页上选取页签本身">🎯 拾取</button>
          </div>
        </div>
        <div class="pt-4 border-t border-gray-100 grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1.5">抓取前预交互元素 <span class="text-xs text-gray-400 font-normal ml-1">选填，用于需悬停/点击才加载的数据</span></label>
            <div class="flex items-center space-x-2">
              <input type="text" class="rule-pre-selector flex-1 min-w-0 px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-hidden transition font-mono" placeholder="CSS选择器，例如：.tooltip-trigger">
              <button type="button" class="pick-pre-btn shrink-0 bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 px-3 py-2 rounded-lg transition text-sm font-medium whitespace-nowrap" title="在网页上点击选取目标元素">🎯 拾取</button>
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">预交互方式 <span class="text-xs text-gray-400 font-normal ml-1">例：鼠标悬停</span></label>
            <select class="rule-pre-type w-full px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-hidden transition">
              <option value="">不需要</option>
              <option value="hover">鼠标悬停 (Hover)</option>
              <option value="click">鼠标点击 (Click)</option>
            </select>
          </div>
        </div>
      </div>
      
      <div class="p-5 border-t border-gray-100 bg-gray-50/60">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold text-gray-800">字段映射列表 <span class="text-xs text-gray-400 font-normal ml-1">网页字段 → 飞书表格列</span></h3>
          <button class="add-field-btn text-xs bg-purple-100 text-purple-700 hover:bg-purple-200 px-3 py-1.5 rounded-lg flex items-center font-medium transition">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> 添加字段
          </button>
        </div>

        <!-- Column headers (aligned with field rows) -->
        <div class="flex items-center space-x-3 px-3 mb-2">
          <div class="flex-1 grid grid-cols-12 gap-3 text-xs font-medium text-gray-400">
            <div class="col-span-3">飞书列名</div>
            <div class="col-span-6">CSS 选择器</div>
            <div class="col-span-3">提取类型</div>
          </div>
          <div class="w-7 shrink-0"></div>
        </div>

        <div class="fields-container space-y-2">
          <!-- Fields will be injected here -->
        </div>
      </div>
      </div>
    </div>
  </template>

  <template id="fieldTemplate">
    <div class="field-item flex items-center space-x-3 bg-white p-3 rounded-lg border border-gray-200 transition-colors hover:border-gray-300 group">
      <div class="flex-1 min-w-0 grid grid-cols-12 gap-3">
        <div class="col-span-3">
          <input type="text" class="field-name w-full px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-hidden transition" placeholder="例如：主页链接">
        </div>
        <div class="col-span-6 flex items-center space-x-2">
          <input type="text" class="field-selector flex-1 min-w-0 px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-hidden transition font-mono" placeholder="CSS选择器，例如：a.profile-link">
          <input type="hidden" class="field-region">
          <button type="button" class="pick-field-btn shrink-0 bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 px-3 py-2 rounded-lg transition text-sm font-medium whitespace-nowrap" title="在网页上点击选取目标元素">🎯 拾取</button>
        </div>
        <div class="col-span-3">
          <select class="field-type w-full px-3 py-2 text-sm bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-hidden transition">
            <option value="text">提取文本内容</option>
            <option value="href">提取链接 (href)</option>
            <option value="src">提取图片 (src)</option>
            <option value="html">提取内部HTML</option>
            <option value="value">提取表单值 (value)</option>
            <option value="current_url">当前页面 URL (不使用选择器)</option>
            <option value="module_screenshot">模块截图</option>
            <option value="screenshot">自由框选截图</option>
          </select>
        </div>
      </div>
      <button class="delete-field-btn shrink-0 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition p-1.5 opacity-60 group-hover:opacity-100" title="删除字段">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
  </template>

  <script src="../shared/storage.js"></script>
  <script src="../shared/config-io.js"></script>
  <script src="options.js"></script>
</body>
</html>
